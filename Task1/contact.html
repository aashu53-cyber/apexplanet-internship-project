<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Task 1 Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">TaskBrand</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Get in Touch</h2>
        <p style="color: var(--text-light);">Have questions or feedback regarding Task 1? Drop a message below.</p>
      </div>

      <div class="contact-form">
        <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Task 1 Project. All rights reserved.</p>
  </footer>

</body>
</html>
